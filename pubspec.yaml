name: "files_utility"
description: "Desktop utility for transferring, copying, counting, and cleaning up files between servers, network shares, and NAS locations."
publish_to: "none"
# Single source of truth for the app version. When bumping, also update:
#   - msix_config.msix_version below (four segments, e.g. 1.0.0.0)
#   - lib/app_info.dart appVersion (shown in UI, window title, log headers)
version: "1.0.0+1"
environment:
  sdk: "^3.10.8"
dependencies:
  flutter:
    sdk: "flutter"
  cupertino_icons: "^1.0.8"
  file_selector: "^1.0.3"
  path: "^1.9.1"
  intl: "^0.20.2"
  shared_preferences: "^2.5.4"
  logging: "^1.3.0"
  provider: "^6.1.5+1"
  path_provider: ^2.1.5
  uuid: ^4.5.3
  window_manager: ^0.5.2
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: "flutter"
  flutter_lints: "^6.0.0"
  msix: "^3.16.7"
  inno_bundle: ^0.12.0
  flutter_launcher_icons: ^0.14.4

# Icon source: assets/icon/app_icon.png is the processed (full-bleed) copy of
# assets/images/app_icon.png. Regenerate icons with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
flutter:
  uses-material-design: true
  assets:
    - "assets/images/app_icon.png"
msix_config:
  display_name: "Files Utility"
  publisher_display_name: "genexis.dev"
  identity_name: "dev.genexis.filesutility"
  # Keep in sync with version: above (four segments).
  msix_version: "1.0.0.0"
  logo_path: "windows/runner/resources/app_icon.ico"
  capabilities: "internetClient"
inno_bundle:
  # AppId GUID — the installer's upgrade identity. It MUST NEVER change, or
  # existing installs will not be upgraded in place. Unique to this app.
  id: "45c1dad5-92eb-46d2-b870-e4db4aaeeadd"
  name: "Files Utility"
  publisher: "genexis.dev"
  installer_icon: "windows/runner/resources/app_icon.ico"
  admin: "auto"
  languages:
    - "english"

# Build commands: see RELEASING.md