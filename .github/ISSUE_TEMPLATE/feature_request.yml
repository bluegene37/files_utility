name: 💡 Feature Request
description: Suggest an idea, enhancement, or new tool for Files Utility
title: "[FEATURE]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement for Files Utility! Please describe your use case and desired solution.
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or limitation? A clear description of the use case.
      placeholder: "I find it difficult to..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new feature you would like to see.
      placeholder: "Add an option to..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've evaluated.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have verified this is not already supported or requested in existing issues.
          required: true
