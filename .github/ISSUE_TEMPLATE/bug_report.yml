name: 🐛 Bug Report
description: Create a report to help us improve Files Utility
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much information as possible to help us reproduce and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Operation Type
      description: Which feature or operation was running when the issue occurred?
      options:
        - Transfer (Move)
        - Copy
        - Delete
        - Count
        - Profiles / Settings
        - Scheduler
        - General UI / Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What platform are you running Files Utility on?
      options:
        - Windows 11
        - Windows 10
        - Windows Server
        - macOS (Apple Silicon / M-series)
        - macOS (Intel)
        - Linux / Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Files Utility Version
      description: Version of the app (found in the title bar or logs, e.g. 1.0.0).
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: filesystem
    attributes:
      label: Storage / Filesystem Type
      description: What type of storage was involved? (e.g. Local NTFS, APFS, SMB Share, Synology NAS, TrueNAS, USB External).
      placeholder: "e.g., SMB Share hosted on Synology NAS"
    validations:
      required: false
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Set source path to '...'
        3. Set destination path to '...'
        4. Click on '...'
        5. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include error messages or popups).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste relevant excerpt from your log file in `~/Documents/FilesUtility/logs/`.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have confirmed that no sensitive or private data is exposed in the pasted logs.
          required: true
