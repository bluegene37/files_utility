name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --fatal-infos

      - run: flutter test

      - run: flutter build windows --release

      # Inno Setup (ISCC) is preinstalled on the windows-latest runner image.
      - run: dart run inno_bundle:build --release --no-app

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows/x64/installer/**/*.exe
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      - run: ./scripts/build_macos_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
