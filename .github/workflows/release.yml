name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Test Suite
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      # ── Authenticode signing ──────────────────────────────────────────
      # Entirely optional: with no WINDOWS_CERT_BASE64 secret set, these
      # steps skip and the release still publishes an unsigned installer
      # exactly as before. Add the secret and the installer gets signed,
      # which is what clears the SmartScreen "Unknown publisher" warning.
      - name: Detect Signing Certificate
        id: signing
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          if [ -n "$CERT_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing certificate present - the installer will be signed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No WINDOWS_CERT_BASE64 secret set - publishing an UNSIGNED installer. Users will see a SmartScreen 'Unknown publisher' warning on first install."
          fi

      - name: Import Signing Certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\cert.pfx",
            [Convert]::FromBase64String($env:CERT_BASE64)
          )

      - name: Sign Application Executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on this runner" }
          $exes = Get-ChildItem -Path "build\windows\x64\runner\Release" -Filter *.exe
          if (-not $exes) { throw "no application .exe found to sign" }
          foreach ($exe in $exes) {
            & $signtool.FullName sign `
              /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:CERT_PASSWORD" `
              /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
              $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing $($exe.Name) failed" }
          }

      - name: Package Inno Setup Installer
        # Inno Setup (ISCC) is preinstalled on windows-latest runners
        run: dart run inno_bundle:build --release --no-app

      # Signed last as well as first: Inno wraps the signed application in a
      # fresh installer executable, and it is that outer .exe SmartScreen
      # inspects when a user downloads it.
      - name: Sign Installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on this runner" }
          $installers = Get-ChildItem -Path "build\windows\x64\installer" -Recurse -Filter *.exe
          if (-not $installers) { throw "no installer .exe found to sign" }
          foreach ($exe in $installers) {
            & $signtool.FullName sign `
              /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:CERT_PASSWORD" `
              /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
              $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing $($exe.Name) failed" }
          }

      - name: Remove Signing Certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\cert.pfx" -ErrorAction SilentlyContinue

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows/x64/installer/**/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Package macOS DMG
        run: |
          chmod +x scripts/build_macos_dmg.sh
          ./scripts/build_macos_dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/*.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The Ubuntu runner ships no GTK development headers, unlike the Windows
      # and macOS images which come with their native toolchains preinstalled.
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Package Linux tar.gz and .deb
        run: |
          chmod +x scripts/build_linux_packages.sh
          ./scripts/build_linux_packages.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          draft: false
          prerelease: false
