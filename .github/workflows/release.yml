name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Test Suite
        run: flutter test

      - name: Package Windows Installer & Bundle
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          ./scripts/build_windows_installer.ps1

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # Gene - Nov, 23, 2026: Build unsigned Microsoft Store MSIX (with STORE_BUILD=true) as a separate artifact for Partner Center ingestion
  build-windows-store:
    name: Build Microsoft Store MSIX
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Test Suite
        run: flutter test

      - name: Package Microsoft Store MSIX
        shell: pwsh
        env:
          MSSTORE_IDENTITY_NAME: ${{ secrets.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ secrets.MSSTORE_PUBLISHER }}
          MSSTORE_DISPLAY_NAME: ${{ secrets.MSSTORE_DISPLAY_NAME }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_IDENTITY_NAME) -or [string]::IsNullOrWhiteSpace($env:MSSTORE_PUBLISHER)) {
            Write-Host "::warning ::MSSTORE_IDENTITY_NAME / MSSTORE_PUBLISHER secrets not set. Skipping Microsoft Store MSIX packaging."
            exit 0
          }
          ./scripts/build_windows_store_msix.ps1
          "MSIX_BUILT=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Microsoft Store MSIX Artifact
        if: env.MSIX_BUILT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-store-msix
          path: dist/*-msstore.msix
          retention-days: 90
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      # Gene - Oct, 07, 2026: Import Apple Developer certificate for Developer ID code signing
      - name: Import Apple Developer Certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "::warning ::MACOS_CERTIFICATE_BASE64 secret not set. Skipping certificate import and codesigning."
            exit 0
          fi
          
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application:" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -n "$IDENTITY" ]; then
            echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
            echo "Loaded signing identity: $IDENTITY"
          else
            echo "::warning ::Developer ID Application identity not found in imported certificate."
          fi

      # Gene - Oct, 07, 2026: Package and sign macOS DMG with Developer ID and optional Notarization
      # Previous implementation:
      # - name: Package macOS DMG
      #   run: |
      #     chmod +x scripts/build_macos_dmg.sh
      #     ./scripts/build_macos_dmg.sh
      - name: Package macOS DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Gene - Nov, 23, 2026: Remove hardcoded Apple Team ID; require APPLE_TEAM_ID secret.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/build_macos_dmg.sh
          ./scripts/build_macos_dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/*.dmg
          if-no-files-found: error

      # Gene - Oct, 07, 2026: Clean up temporary keychain after build
      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The Ubuntu runner ships no GTK development headers, unlike the Windows
      # and macOS images which come with their native toolchains preinstalled.
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Package Linux tar.gz and .deb
        run: |
          chmod +x scripts/build_linux_packages.sh
          ./scripts/build_linux_packages.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  # Gene - Nov, 24, 2026: Only run publish-release on v* tag pushes and download only public release artifacts (never windows-store-msix).
  #   publish-release:
  #     name: Publish GitHub Release
  #     runs-on: ubuntu-latest
  #     needs: [build-windows, build-macos, build-linux]
  #     steps:
  #       - name: Download Built Artifacts
  #         uses: actions/download-artifact@v4
  #         with:
  #           path: dist
  #           merge-multiple: true
  #
  #       - name: Attach Artifacts to GitHub Release
  #         uses: softprops/action-gh-release@v2
  #         with:
  #           files: dist/**
  #           generate_release_notes: true
  #           draft: false
  #           prerelease: false
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    steps:
      - name: Download Windows Public Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: dist

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist

      - name: Attach Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          draft: false
          prerelease: false
